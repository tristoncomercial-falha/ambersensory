<style>
:root{--void:#070203;--ink:#12080a;--ink2:#1a0c0e;--ruby:#e3141f;--text:#f3e7e5;--muted:#a38a88;--line:rgba(227,20,31,.35);--serif:"Cinzel",Georgia,serif;--sans:"Montserrat",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--void);color:var(--text);font:14px/1.5 var(--sans);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.wrap{max-width:980px;margin:0 auto;padding-block:32px 60px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}
header img{height:54px;mix-blend-mode:screen}
header h1{font:600 20px var(--serif);letter-spacing:.18em;margin:0}
header .sub{color:var(--muted);font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.caps{text-transform:uppercase;letter-spacing:.3em;font-size:11px;font-weight:500}
.login{max-width:380px;margin:70px auto;display:grid;gap:14px;text-align:center}
input{background:var(--ink);border:1px solid var(--line);color:#fff;padding:13px 14px;font:15px var(--sans);width:100%}
input:focus{outline:none;border-color:var(--ruby)}
button{cursor:pointer;background:linear-gradient(180deg,#e3141f,#9d0710);border:1px solid #ff4a3a;color:#fff;font:600 11.5px var(--sans);letter-spacing:.28em;text-transform:uppercase;padding:13px 18px}
button.ghost{background:transparent;border-color:var(--line);color:var(--text)}
button:hover{filter:brightness(1.1)}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.err{color:#ff7468;font-size:13px;min-height:1em}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:26px 0 18px}
.bar input{flex:1;min-width:200px}
.stat{display:flex;align-items:baseline;gap:12px;margin-top:26px}
.stat b{font:600 54px/1 var(--serif);background:linear-gradient(175deg,#ffd6cf,#ff4034 30%,#b3060f 60%,#ff5a3f);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .caps{color:var(--muted)}
.upd{color:var(--muted);font-size:12px;margin-left:auto}
.tablewrap{overflow-x:auto;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font:500 10.5px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line);background:var(--ink)}
td{padding:12px 14px;border-bottom:1px solid rgba(227,20,31,.12);font-variant-numeric:tabular-nums}
tr:nth-child(even) td{background:rgba(255,255,255,.015)}
td a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line)}
td a:hover{color:#fff;border-color:var(--ruby)}
td.n{color:var(--muted);width:48px}
.empty{padding:40px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>

const $ = s => document.querySelector(s);
let lista = [];

const fmtWpp = d => {
  d = String(d).replace(/\D/g,"");
  if(d.length === 11) return `(${d.slice(0,2)}) ${d[2]} ${d.slice(3,7)}-${d.slice(7)}`;
  if(d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return d;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function getKey(){ try{ return sessionStorage.getItem("amber_key") || ""; }catch(_){ return ""; } }
function setKey(k){ try{ sessionStorage.setItem("amber_key", k); }catch(_){} }

async function load(key){
  if(!SCRIPT_URL) throw new Error("Configure a SCRIPT_URL no admin.html.");
  let j;
  try{
    const r = await fetch(SCRIPT_URL + "?key=" + encodeURIComponent(key) + "&t=" + Date.now());
    j = await r.json();
  }catch(_){
    throw new Error("Não consegui falar com o servidor. Abra o painel pelo link do site publicado (ex.: seusite/admin.html), não pela pré-visualização do arquivo.");
  }
  if(!j.ok) throw new Error(j.error === "senha incorreta" ? "Senha incorreta. Confira se digitou exatamente: letras minúsculas e hífens." : (j.error || "Falha ao carregar."));
  lista = j.lista.sort((a,b) => a.ts - b.ts);
  $("#total").textContent = lista.length;
  $("#upd").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  render();
}

function filtered(){
  const q = $("#q").value.trim().toLowerCase();
  const qd = q.replace(/\D/g,"");
  return lista.map((p,i) => ({...p, n:i+1})).filter(p => !q ||
    p.nome.toLowerCase().includes(q) || p.instagram.toLowerCase().includes(q) || (qd && String(p.whatsapp).includes(qd)));
}

function render(){
  const f = filtered();
  $("#rows").innerHTML = f.map(p => {
    const ig = p.instagram.replace(/^@/,"");
    const w = String(p.whatsapp).replace(/\D/g,"");
    return `<tr><td class="n">${p.n}</td><td>${esc(p.nome)}</td>
      <td><a href="https://instagram.com/${encodeURIComponent(ig)}" target="_blank" rel="noopener">@${esc(ig)}</a></td>
      <td><a href="https://wa.me/55${w}" target="_blank" rel="noopener">${fmtWpp(w)}</a></td>
      <td>${esc(p.data)}</td></tr>`;
  }).join("");
  $("#empty").hidden = f.length > 0;
}

$("#login").addEventListener("submit", async e => {
  e.preventDefault();
  const k = $("#key").value.replace(/\s+/g,"").toLowerCase();
  $("#loginerr").textContent = "";
  try{ await load(k); setKey(k); $("#login").hidden = true; $("#panel").hidden = false; }
  catch(err){ $("#loginerr").textContent = err.message; }
});
$("#q").addEventListener("input", render);
$("#reload").addEventListener("click", () => load(getKey()).catch(err => alert(err.message)));

$("#csv").addEventListener("click", () => {
  const lines = [["#","Nome","Instagram","WhatsApp","Inscrição"]]
    .concat(lista.map((p,i) => [i+1, p.nome, p.instagram, fmtWpp(p.whatsapp), p.data]))
    .map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
  const blob = new Blob(["﻿" + lines], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "amber-inscritos.csv"; a.click();
});

$("#pdf").addEventListener("click", () => {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const W = doc.internal.pageSize.getWidth();
  const agora = new Date().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

  // cabeçalho preto com a marca
  doc.setFillColor(7,2,3); doc.rect(0,0,W,118,"F");
  const lw = 164, lh = lw * 580 / 1014;
  doc.addImage(LOGO, "JPEG", (W - lw) / 2, (118 - lh) / 2, lw, lh);
  doc.setDrawColor(227,20,31); doc.setLineWidth(1); doc.line(0,118,W,118);

  doc.setTextColor(20,10,10); doc.setFont("helvetica","bold"); doc.setFontSize(15);
  doc.text("LISTA DE INSCRITOS", 40, 152);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(110,90,90);
  doc.text("25/09 · GEMMA · João Pessoa – PB   |   VINY + TRISTON", 40, 168);
  doc.text(`${lista.length} inscritos · gerado em ${agora}`, W-40, 152, {align:"right"});

  doc.autoTable({
    startY: 184,
    head: [["#","Nome","Instagram","WhatsApp","Inscrição"]],
    body: lista.map((p,i) => [i+1, p.nome, p.instagram, fmtWpp(p.whatsapp), p.data]),
    theme: "grid",
    styles: { font:"helvetica", fontSize:9.5, cellPadding:6, lineColor:[235,220,220], lineWidth:.5, textColor:[25,15,15] },
    headStyles: { fillColor:[160,8,16], textColor:255, fontStyle:"bold", fontSize:8.5 },
    alternateRowStyles: { fillColor:[251,246,246] },
    columnStyles: { 0:{cellWidth:30, halign:"right", textColor:[140,110,110]}, 3:{cellWidth:110}, 4:{cellWidth:72} },
    margin: { left:40, right:40, bottom:40 },
    didDrawPage: () => {
      const H = doc.internal.pageSize.getHeight();
      doc.setFontSize(8); doc.setTextColor(150,120,120);
      doc.text("AMBER at GEMMA · lista confidencial", 40, H-20);
      doc.text(`página ${doc.internal.getNumberOfPages()}`, W-40, H-20, {align:"right"});
    }
  });
  doc.save(`amber-inscritos-${new Date().toISOString().slice(0,10)}.pdf`);
});

// login automático na mesma aba
if(getKey()){ load(getKey()).then(() => { $("#login").hidden = true; $("#panel").hidden = false; }).catch(() => {}); }
</script>
</body>
</html>
